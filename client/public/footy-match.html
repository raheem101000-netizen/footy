<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>FOOTY — Match</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Barlow+Condensed:wght@600;700;800&family=Space+Grotesk:wght@400;600;700&display=swap">
<style>
:root{
  --night:#0b1a12; --chalk:#f3f5ee; --ink:#14361c; --gold:#ffcf3a;
  --display:'Lilita One','Arial Rounded MT Bold','Trebuchet MS',sans-serif;
  --ui:'Barlow Condensed','Arial Narrow','Roboto Condensed',sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{background:var(--night);color:var(--chalk);font-family:var(--ui);overflow:hidden;-webkit-user-select:none;user-select:none;touch-action:none}
#wrap{position:fixed;inset:0;display:grid;place-items:center;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:max(10px,env(safe-area-inset-top,0px)) max(10px,env(safe-area-inset-bottom,0px))}
#box{position:relative}
#stage{position:absolute;left:0;top:0;width:800px;height:540px;transform-origin:0 0;overflow:hidden;border-radius:6px;background:#11281a;box-shadow:0 18px 60px rgba(0,0,0,.6)}
#cv{position:absolute;inset:0;width:800px;height:540px;display:block}
.hudbtn{position:absolute;font-family:var(--ui);font-weight:800;font-size:20px;color:#fff;background:none;border:0;cursor:pointer;padding:2px 6px}
.icon{position:absolute;width:22px;height:22px;border:0;background:none;cursor:pointer;padding:0}
#conn{position:absolute;left:50%;top:150px;transform:translateX(-50%);display:none;padding:7px 14px;border-radius:8px;font:700 15px var(--ui);letter-spacing:.04em;
  background:rgba(20,16,0,.75);border:1px solid rgba(255,180,0,.6);color:#FFB400;white-space:nowrap;pointer-events:none;z-index:6}
/* end of match (same flow as Pong's) */
#result,#confirm{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;background:radial-gradient(ellipse 70% 55% at 50% 0%,rgba(212,175,55,.16),transparent 70%),rgba(12,11,8,.9);z-index:10;text-align:center;gap:6px}
#result{overflow:hidden}
#result.won{background:radial-gradient(ellipse 60% 55% at 50% 30%,rgba(212,175,55,.35),transparent 70%),rgba(8,7,5,.9)}
#result > *{position:relative;z-index:1}
#r-confetti{position:absolute!important;inset:0;z-index:0!important;pointer-events:none}
#r-confetti i{position:absolute;width:8px;height:14px;border-radius:2px;opacity:.85;animation:fall linear infinite}
@keyframes fall{from{transform:translateY(-60px) rotate(0)}to{transform:translateY(620px) rotate(540deg)}}
@media (prefers-reduced-motion:reduce){#r-confetti i{animation:none}}
#r-title{font:72px var(--display);text-shadow:0 5px 0 #000,0 0 24px rgba(212,175,55,.45)}
#r-amt{display:none;font:64px var(--display);color:#fff;text-shadow:0 4px 0 #000;line-height:1}
#r-credit{display:none;font:700 17px 'Space Grotesk',sans-serif;color:#f5e6b0;margin:6px 0 2px;max-width:560px}
#r-score{font:800 22px var(--ui);color:rgba(255,255,255,.75);margin:6px 0 14px}
.btn.gold{background:#d4af37;color:#1a1405}
.btn.goldghost{background:transparent;color:#f5e6b0;border:1px solid rgba(212,175,55,.5)}
/* kick-off splash */
#splash{position:absolute;inset:0;z-index:8;display:none;flex-direction:column;align-items:center;justify-content:center;pointer-events:none;
  background:radial-gradient(ellipse 70% 60% at 50% 55%,rgba(212,175,55,.28),transparent 70%),rgba(8,7,5,.86)}
#splash .row{display:flex;align-items:center;gap:34px}
#splash .side{display:flex;flex-direction:column;align-items:center;width:230px}
#splash canvas{width:186px;height:180px;image-rendering:pixelated;filter:drop-shadow(0 10px 14px rgba(0,0,0,.7))}
#splash .nm{font:30px var(--display);color:#fff;margin-top:6px;text-shadow:0 3px 0 #000;max-width:230px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#splash .vs{font:96px var(--display);color:#d4af37;text-shadow:0 5px 0 #000,0 0 30px rgba(212,175,55,.6);margin-top:-40px}
#splash .pz{margin-top:18px;font:800 26px var(--ui);letter-spacing:.12em;color:#1a1405;background:#d4af37;padding:6px 22px;border-radius:999px}
#splash .ko{margin-top:12px;font:800 20px var(--ui);letter-spacing:.2em;color:#f5e6b0}
.btn{font:800 22px var(--ui);letter-spacing:.03em;border:0;border-radius:9px;padding:9px 30px;cursor:pointer;margin:4px}
.btn.green{background:#4CFF6C;color:#0d2a12}
.btn.purple{background:#d4af37;color:#1a1405}
.btn.ghost{background:rgba(255,255,255,.08);color:rgba(255,255,255,.8);border:1px solid rgba(255,255,255,.25)}
.btn[disabled]{opacity:.55;cursor:default}
.back{display:inline-block;margin-top:10px;font:13px 'Space Grotesk',sans-serif;letter-spacing:1px;color:rgba(255,255,255,.6);text-decoration:none;border:1px solid rgba(212,175,55,.35);border-radius:6px;padding:8px 18px}
#c-msg{font:800 26px var(--ui);max-width:520px;line-height:1.2;margin-bottom:10px}
/* touch controls (phones / tablets) */
#pad{position:absolute;inset:0;pointer-events:none;display:none;z-index:5}
#pad.on{display:block}
.tb{position:absolute;bottom:68px;width:84px;height:84px;border-radius:50%;background:rgba(255,255,255,.14);border:2px solid rgba(255,255,255,.35);
  color:#fff;font:800 20px var(--ui);display:grid;place-items:center;pointer-events:auto;touch-action:none}
.tb.down{background:rgba(255,255,255,.34)}
</style>
</head>
<body>
<div id="wrap"><div id="box"><div id="stage">
  <canvas id="cv" width="1600" height="1080" aria-label="FOOTY match"></canvas>
  <button class="hudbtn" id="gQuit" style="left:690px;top:510px" title="Quitting a live match is an instant loss">Quit</button>
  <button class="icon" id="gMus" style="left:742px;top:488px" aria-label="Crowd sound"></button>
  <button class="icon" id="gSnd" style="left:770px;top:488px" aria-label="Sound effects"></button>
  <div id="conn"></div>
  <div id="pad">
    <div class="tb" data-k="l" style="left:14px">◀</div>
    <div class="tb" data-k="r" style="left:108px">▶</div>
    <div class="tb" data-k="u" style="right:108px">JUMP</div>
    <div class="tb" data-k="k" style="right:14px">KICK</div>
  </div>
  <div id="confirm">
    <div id="c-msg">Quit the match? Quitting a live match is an instant loss.</div>
    <div><button class="btn ghost" id="c-no">Keep playing</button><button class="btn purple" id="c-yes" style="background:#e0332b;color:#fff">Quit and lose</button></div>
  </div>
  <div id="splash">
    <div class="row">
      <div class="side"><canvas id="sp-lc" width="93" height="90"></canvas><div class="nm" id="sp-l"></div></div>
      <div class="vs">VS</div>
      <div class="side"><canvas id="sp-rc" width="93" height="90" style="transform:scaleX(-1)"></canvas><div class="nm" id="sp-r"></div></div>
    </div>
    <div class="pz" id="sp-pz"></div>
    <div class="ko" id="sp-ko">KICK-OFF IN 3</div>
  </div>
  <div id="result">
    <div id="r-confetti"></div>
    <div id="r-title">YOU WIN!</div>
    <div id="r-amt"></div>
    <div id="r-credit"></div>
    <div id="r-score">3 — 1</div>
    <div><button class="btn gold" id="btn-rematch" style="display:none">REMATCH</button><button class="btn goldghost" id="btn-lobby">Back to Lobby</button></div>
    <a class="back" href="https://tenten.run/">← TENTEN</a>
  </div>
</div></div></div>

<script src="/colyseus-adapter.js"></script>
<script>
(() => {
'use strict';
/* ---------------- stage scaling ---------------- */
const stage = document.getElementById('stage'), box = document.getElementById('box'), wrap = document.getElementById('wrap');
function fit() {
  const cs = getComputedStyle(wrap);
  const w = wrap.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight);
  const h = wrap.clientHeight - parseFloat(cs.paddingTop) - parseFloat(cs.paddingBottom);
  const k = Math.max(0.2, Math.min(w / 800, h / 540));
  stage.style.transform = 'scale(' + k + ')'; box.style.width = 800 * k + 'px'; box.style.height = 540 * k + 'px';
}
addEventListener('resize', fit); fit();
const cv = document.getElementById('cv'), ctx = cv.getContext('2d');
const rand = Math.random, getRand = n => Math.floor(rand() * n);

/* ---------------- the ape (same art as the single-player game) ---------------- */
const SHIRTS = { red: ['#d7261e', '#ffffff'], blue: ['#1d4fc4', '#ffffff'] };
const CHIMP = {"pal": ["#371510", "#3b1d03", "#2d1705", "#220d09", "#3c1f02", "#3a1f03", "#f5c0a9", "#c28a7e", "#f3c59e", "#f0c6a0", "#60302a", "#f1c69c", "#f2c79f", "#e9e1dc"], "rows": ["...............abbbcdd.........", "............aaabbbccecd........", "..........aacffffbfeddca.......", "........adbefffeeeeeecdca......", ".......accbbfffeeeedddccc......", ".......acbffcbbcbbbbbbcccc.....", "...add.abffbgggggggggggggcda...", "..achhabbebhinllllniinllllnca..", ".achllhhbefgmnnnnnnjinnnnnnlhd.", "abhhggllbeehnnnnddnjinnnddnlhcd", "ahhlglggbebhnnnnddnjmnnnddnlggd", "adggglggeebhnnnnnnnjmnnnnnnllgc", "adgilmngebehnnnnnnnjmnnnnnnjnbc", "ccnmlmnleeebhggggggimggggggmmd.", ".annnmmgbeebchgiiiilllliimgicd.", ".acminndcbeefhjinllgniillnicd..", "..acincdcceefbhmlgglmmlgglcd...", "...bccc.dceebbhjnjmnjhgimjc....", "........dceecchimmmmmihnmmc....", "........dceechiimmmmmmhimih....", "........dbeehjmmmmmmmiihmmmh...", "........dbeehmmmmmmmmmmhmmmh...", "........dbeehnmmmmmmmmmmhmmh...", "........dbeehnmmmhmlllllmmmh...", "........Wbebhnmmmmmmmmmmmmh....", "........KWebdhmmmmmmmmmmmmW....", "........dKWWddhhhhhhhhhhWWK....", ".........dKKWWWWWWWWWWWWKKd....", "..........ddKKKKKKKKKKKKdd.....", "............dddddddddddd......."], "cell": 1.5};
const headCache = {};
function headImg(col) {
  if (headCache[col]) return headCache[col];
  const W = CHIMP.rows[0].length, H = CHIMP.rows.length, c = document.createElement('canvas');
  c.width = W * 3; c.height = H * 3; const g = c.getContext('2d');
  const KEYS = 'abcdefghijlmnopqrstuvwxyzABCDEFGHIJLMNOPQRSTUVWXYZ0123456789', kit = SHIRTS[col][0];
  CHIMP.rows.forEach((row, y) => { for (let x = 0; x < row.length; x++) { const ch = row[x]; if (ch === '.') continue;
    g.fillStyle = ch === 'K' ? kit : ch === 'W' ? '#ffffff' : CHIMP.pal[KEYS.indexOf(ch)]; g.fillRect(x * 3, y * 3, 3, 3); } });
  c.gw = W * CHIMP.cell; c.gh = H * CHIMP.cell; c.ox = -c.gw / 2; c.oy = 20 - c.gh;
  headCache[col] = c; return c;
}

/* ---------------- audio (synthesised, same sounds as the single-player game) ---------------- */
const AU = { ctx: null, sfx: true, music: true };
function audioOn() {
  if (AU.ctx) { if (AU.ctx.state === 'suspended') AU.ctx.resume(); return; }
  try {
    AU.ctx = new (window.AudioContext || window.webkitAudioContext)();
    AU.out = AU.ctx.createGain(); AU.out.gain.value = .5; AU.out.connect(AU.ctx.destination);
    const len = AU.ctx.sampleRate * 2, buf = AU.ctx.createBuffer(1, len, AU.ctx.sampleRate), d = buf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = rand() * 2 - 1; AU.noise = buf;
    const src = AU.ctx.createBufferSource(); src.buffer = buf; src.loop = true;
    const f = AU.ctx.createBiquadFilter(); f.type = 'bandpass'; f.frequency.value = 480; f.Q.value = .5;
    AU.crowd = AU.ctx.createGain(); AU.crowd.gain.value = AU.music ? .05 : 0; src.connect(f).connect(AU.crowd).connect(AU.out); src.start();
  } catch (e) { AU.ctx = null; }
}
function env(g, t, a, p, d) { g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(p, t + a); g.gain.exponentialRampToValueAtTime(.0001, t + a + d); }
function tone(type, f0, f1, t, a, p, d) { const c = AU.ctx, o = c.createOscillator(), g = c.createGain(); o.type = type; o.frequency.setValueAtTime(f0, t);
  if (f1) o.frequency.exponentialRampToValueAtTime(f1, t + a + d); env(g, t, a, p, d); o.connect(g).connect(AU.out); o.start(t); o.stop(t + a + d + .05); return o; }
function hiss(t, type, fr, q, p, a, d) { const c = AU.ctx, n = c.createBufferSource(), f = c.createBiquadFilter(), g = c.createGain(); n.buffer = AU.noise;
  f.type = type; f.frequency.value = fr; f.Q.value = q; env(g, t, a, p, d); n.connect(f).connect(g).connect(AU.out); n.start(t); n.stop(t + a + d + .05); }
function playSound(name) {
  if (!AU.ctx || !AU.sfx) return; const t = AU.ctx.currentTime;
  switch (name) {
    case 'kickSound': tone('sine', 170, 50, t, .003, .7, .13); hiss(t, 'highpass', 1600, .7, .2, .002, .05); break;
    case 'jumpSound': tone('square', 260, 520, t, .004, .05, .09); break;
    case 'coinSound': tone('square', 988, 0, t, .003, .08, .07); tone('square', 1319, 0, t + .07, .003, .08, .18); break;
    case 'popSound': tone('sine', 500, 900, t, .003, .25, .06); break;
    case 'dieSound': tone('sawtooth', 320, 140, t, .01, .12, .55); break;
    case 'cheerSound': hiss(t, 'bandpass', 900, .5, .5, .2, 2.2); hiss(t, 'bandpass', 1800, 1, .18, .15, 1.6); break;
    case 'whistleSound': { const o = tone('sine', 2700, 0, t, .01, .2, .5), l = AU.ctx.createOscillator(), lg = AU.ctx.createGain();
      l.frequency.value = 32; lg.gain.value = 160; l.connect(lg).connect(o.frequency); l.start(t); l.stop(t + .6); break; }
    case 'explosionSound': hiss(t, 'lowpass', 700, .4, .8, .005, .7); tone('sine', 90, 30, t, .005, .6, .5); break;
  }
}
addEventListener('pointerdown', audioOn); addEventListener('keydown', audioOn);

/* ================================================================
   NETWORK — the server runs the match; this page sends keys and draws
   ================================================================ */
const auth = window.footyAuth();
const roomFromURL = new URLSearchParams(location.search).get('room');
if (!auth || !roomFromURL) location.replace('/rooms.html');
const browserId = (() => { try { let id = localStorage.getItem('footy_bid'); if (!id) { id = Math.random().toString(36).slice(2, 10) + Math.random().toString(36).slice(2, 10); localStorage.setItem('footy_bid', id); } return id; } catch (e) { return null; } })();
let socket = null, mySide = 'R', myName = (auth && auth.name) || 'You', oppName = 'Opponent', matchPrize = null;
let meReconnecting = false, oppAway = false, matchOver = false, lobbyReturnTimer = null, joined = false;
const mirrored = () => mySide === 'L';   // the left player's page is mirrored, so you always play on the right

function setConn() {
  const el = document.getElementById('conn');
  const t = matchOver ? '' : meReconnecting ? 'Connection lost — reconnecting… your player is kept' : oppAway ? (oppName + ' is away — waiting for them…') : '';
  el.textContent = t; el.style.display = t ? 'block' : 'none';
}

// Snapshots from the server, oldest first; drawn a little behind the newest
// so movement stays smooth over an uneven connection.
const snaps = [];
let renderF = null;
// How far behind the newest frame everything is drawn: just enough to cover this connection's
// unevenness (measured), so it's as small as the connection allows. Nothing is guessed: every
// position on screen is one the server sent.
const delayF = 2.2;   // playback runs ~73 ms behind the newest frame (the setting from when nobody felt lag)
let lastArrive = 0, jitter = 6;
let rtt = 80;                                   // ms, measured with ping (for the readout)
const netStat = { gaps: [], show: /[?&]net=1/.test(location.search) };
addEventListener('keydown', e => { if (e.code === 'KeyN') netStat.show = !netStat.show; });
const effects = [];          // one-shot effects, animated here
let lastTx = 0, txT = 999, lastGw = 0, gwT = 0;
const trail = [];

function onSnap(s) {
  if (snaps.length && s.f <= snaps[snaps.length - 1].f) snaps.length = 0;   // a new match restarted the frame count
  snaps.push(s);
  if (snaps.length > 90) snaps.splice(0, snaps.length - 90);
  // sounds and effects as they happen (skipped when a burst of late frames arrives together)
  s.at = performance.now();
  if (lastArrive) { const gap = s.at - lastArrive; jitter += (Math.abs(gap - 1000 / 30) - jitter) * .05; netStat.gaps.push([s.at, gap]); if (netStat.gaps.length > 400) netStat.gaps.shift(); }
  lastArrive = s.at;
  for (const n of s.snd) playSound(n);
  for (const e of s.fx) effects.push({ k: e[0], x: e[1], y: e[2], xs: e[3] || 0, ys: e[4] || 0, t: 0 });
  if (s.tx && s.tx.seq !== lastTx) { lastTx = s.tx.seq; txT = 0; }
  if (s.gw && s.gw.seq !== lastGw) { lastGw = s.gw.seq; gwT = 0; }
}

function connect() {
  socket = io();
  socket.on('connect', () => { meReconnecting = false; setConn(); socket.emit('joinRoom', { code: roomFromURL, name: myName, bid: browserId }); sendKeys(true); });
  socket.on('resume', () => { meReconnecting = false; setConn(); socket.emit('joinRoom', { code: roomFromURL, name: myName, bid: browserId }); sendKeys(true); });
  socket.on('drop', () => { meReconnecting = true; setConn(); });
  socket.on('match_gone', () => {
    matchOver = true; setConn();
    showResult('MATCH OVER', '#FF4444', 'You were away too long — the match ended without you.');
    returnToLobbySoon();
  });
  socket.on('roomJoined', (d) => { joined = true; mySide = d.side || (d.role === 'p1' ? 'L' : 'R'); if (d.myName) myName = d.myName; if (d.prize) matchPrize = d.prize; });
  socket.on('opponentName', ({ name }) => { oppName = name || 'Opponent'; });
  socket.on('presence', ({ p1Away, p2Away }) => { oppAway = mySide === 'L' ? !!p2Away : !!p1Away; setConn(); });
  socket.on('kickoff', () => { snaps.length = 0; renderF = null; effects.length = 0; trail.length = 0; hide('result'); });
  socket.on('s', onSnap);
  socket.on('pong', (d) => { if (d && d.ts) { const ms = performance.now() - d.ts; if (ms > 0 && ms < 2000) rtt += (ms - rtt) * .3; } });
  setInterval(() => { if (socket && socket.connected) socket.emit('ping', { ts: performance.now() }); }, 1000);
  socket.on('superseded', ({ message }) => {
    matchOver = true; setConn();
    showResult('OPENED ELSEWHERE', '#FFB400', message || 'You opened this match somewhere else.');
  });
  socket.on('connect_error', (e) => { if (e && e.message) showResult('CAN’T CONNECT', '#FF4444', e.message); });
  socket.on('matchEnd', (d) => {
    matchOver = true; setConn(); hide('confirm');
    const iWon = (mySide === 'L' && d.winner === 'p1') || (mySide === 'R' && d.winner === 'p2');
    const mine = mySide === 'L' ? d.p1Score : d.p2Score, theirs = mySide === 'L' ? d.p2Score : d.p1Score;
    let line = mine + ' — ' + theirs + ' vs ' + oppName;
    if (d.forfeit) line = iWon ? oppName + ' quit the match' : 'You quit the match';
    else if (d.walkover) line = iWon ? 'Your opponent left the match' : 'You were away too long. ' + oppName + ' won.';
    showResult(iWon ? 'YOU WIN!' : 'YOU LOSE!', iWon ? '#d4af37' : '#ff5a4f', line, iWon);
    if (iWon) { amount(matchPrize ? '+$' + matchPrize : ''); credit('adding to your balance…', '#f5e6b0'); }
    if (!iWon && d.walkover) returnToLobbySoon();
  });
  socket.on('footymp:credit', (c) => {
    if (c && c.status === 'credited') { amount('+$' + c.amount); credit('added to your balance', '#f5e6b0'); }
    else if (c && c.status === 'disabled') { amount(''); credit("Cash prizes aren't live yet — no balance was credited for this win.", 'rgba(255,255,255,0.6)'); }
    else credit("Your prize couldn't be added automatically — it's been logged and will be credited.", '#FFB400');
  });
  socket.on('rematch:available', () => {
    if (lobbyReturnTimer) return;
    const b = document.getElementById('btn-rematch'); b.style.display = 'inline-block'; b.disabled = false; b.textContent = 'REMATCH';
  });
  socket.on('rematch:go', () => {
    const b = document.getElementById('btn-rematch'); b.disabled = true; b.textContent = 'Back to the room…';
    setTimeout(() => { if (socket) socket.disconnect(); location.href = lobbyURL(); }, 400);
  });
  socket.on('rematch:error', ({ message }) => {
    document.getElementById('btn-rematch').style.display = 'none';
    credit(message || 'Rematch not possible right now', '#FFB400');
  });
  socket.on('opponentLeft', () => {
    matchOver = true; setConn();
    showResult('MATCH STOPPED', '#FFB400', 'Both players were away — the match was stopped.');
    returnToLobbySoon(3);
  });
}
function lobbyURL() { return '/rooms.html?name=' + encodeURIComponent(myName); }
function hide(id) { document.getElementById(id).style.display = 'none'; }
function showResult(title, color, line, won) {
  const t = document.getElementById('r-title'); t.textContent = title; t.style.color = color;
  document.getElementById('r-score').textContent = line;
  document.getElementById('r-credit').style.display = 'none';
  amount('');
  const r = document.getElementById('result'), cf = document.getElementById('r-confetti');
  r.classList.toggle('won', !!won); cf.innerHTML = '';
  if (won) {   // confetti behind the words and buttons
    const C = ['#d4af37', '#ffe9a3', '#ffffff', '#1d4fc4', '#d7261e'];
    for (let i = 0; i < 70; i++) { const d = document.createElement('i'); d.style.left = (Math.random() * 800) + 'px'; d.style.top = (Math.random() * 540 - 540) + 'px';
      d.style.background = C[i % 5]; d.style.animationDuration = (2.5 + Math.random() * 3) + 's'; d.style.animationDelay = (-Math.random() * 5) + 's'; cf.appendChild(d); }
  }
  hide('splash');
  r.style.display = 'flex';
}
function amount(t) { const el = document.getElementById('r-amt'); el.textContent = t; el.style.display = t ? 'block' : 'none'; }

function lerpBody(A, B, t) {   // arrays of [x,y,a, x,y,a, ...rest]
  if (!A || !B) return B || A;
  if (Math.hypot(B[0] - A[0], B[1] - A[1]) > 80) return B;   // a reset (kick-off), not movement
  const out = B.slice();
  out[0] = lerp(A[0], B[0], t); out[1] = lerp(A[1], B[1], t); out[2] = lerpA(A[2], B[2], t);
  if (B.length > 5) { out[3] = lerp(A[3], B[3], t); out[4] = lerp(A[4], B[4], t); out[5] = lerpA(A[5], B[5], t); }
  return out;
}
function viewAt(f) {
  if (!snaps.length) return null;
  if (f <= snaps[0].f) return snaps[0];
  const last = snaps[snaps.length - 1];
  if (f >= last.f) return last;
  let i = snaps.length - 2; while (i > 0 && snaps[i].f > f) i--;
  const A = snaps[i], B = snaps[i + 1], t = (f - A.f) / (B.f - A.f);
  if (!A.w || !B.w) return B;
  const L = lerpBody(A.L, B.L, t), R = lerpBody(A.R, B.R, t);
  // Boots: through the server's own in-between positions (3 per frame), so the whole swing shows.
  if (B.bs) for (const [side, P] of [['L', L], ['R', R]]) {
    const a0 = A[side], b1 = B[side], sub = B.bs[side];
    if (!a0 || !b1 || !sub || sub.length < 6 || P === b1) continue;
    const pts = [[a0[3], a0[4], a0[5]], [sub[0], sub[1], sub[2]], [sub[3], sub[4], sub[5]], [b1[3], b1[4], b1[5]]];
    const k = Math.min(2, Math.floor(t * 3)), u = t * 3 - k, p0 = pts[k], p1 = pts[k + 1];
    P[3] = lerp(p0[0], p1[0], u); P[4] = lerp(p0[1], p1[1], u); P[5] = lerpA(p0[2], p1[2], u);
  }
  return Object.assign({}, B, { b: lerpBody(A.b, B.b, t), L, R,
    st: A.st && B.st ? [lerp(A.st[0], B.st[0], t), lerp(A.st[1], B.st[1], t)] : B.st });
}

// Boots never jump: the drawn boot follows the server's boot but moves at most a small step per
// screen frame, so a big move in one server frame (the fast whip back after a kick, or two frames
// arriving together) is drawn through the middle of the swing over the next 2-3 screen frames.
// Drawing only — the server's boot still decides every touch.
const BOOT_OFF = { R: 3.09, L: 0.05 };          // where the boot sits around the head, for its angle
const BOOT_STEP = 0.3;                          // most a boot turns in one 60 Hz screen frame (a normal swing is ~0.26)
const shownBoot = { L: null, R: null };
function smoothBoots(v, dt) {
  if (!v || !v.w) { shownBoot.L = shownBoot.R = null; return v; }
  const out = Object.assign({}, v);
  for (const side of ['L', 'R']) {
    const P = v[side]; if (!P) continue;
    const target = P[5];
    let a = shownBoot[side];
    if (a === null || Math.abs(wrapA(target - a)) > 2.6) a = target;     // first frame or a kick-off reset: no animation
    else { const d = wrapA(target - a), m = BOOT_STEP * Math.max(1, dt / (1000 / 60)); a = Math.abs(d) <= m ? target : a + Math.sign(d) * m; }
    shownBoot[side] = a;
    if (a !== target) {
      const Q = P.slice(), phi = a + BOOT_OFF[side], r = Math.hypot(P[3] - P[0], P[4] - P[1]) || 16.1 * P[7];
      Q[3] = P[0] + Math.cos(phi) * r; Q[4] = P[1] + Math.sin(phi) * r; Q[5] = a;
      out[side] = Q;
    }
  }
  return out;
}
const wrapA = a => { while (a > Math.PI) a -= 2 * Math.PI; while (a < -Math.PI) a += 2 * Math.PI; return a; };

let lastT = performance.now(), fxAcc = 0;
function frame(now) {
  const dt = Math.min(250, now - lastT); lastT = now;
  const newest = snaps.length ? snaps[snaps.length - 1].f : 0;
  if (renderF === null && snaps.length) renderF = newest - delayF;
  if (renderF !== null) {
    const target = newest - delayF;
    if (Math.abs(target - renderF) > 15) renderF = target;           // far off (tab was hidden): jump
    else {
      // After a late update, catch up by playing a little faster for a moment
      // (up to 1.6x) instead of leaping ahead.
      const rate = Math.max(0.9, Math.min(1.6, 1 + (target - renderF) * 0.3));
      renderF += dt * 30 / 1000 * rate;
    }
    if (renderF > newest) renderF = newest;                          // never draw past the newest real frame
  }
  // effects advance at the game's 30 frames a second
  fxAcc += dt * 30 / 1000;
  while (fxAcc >= 1) { fxAcc -= 1; stepEffects(); }
  const view = smoothBoots(renderF === null ? null : viewAt(renderF), dt);
  window.__view = view; window.__pb = [renderF, newest];   // what this screen is drawing (read by test players)
  draw(view);
  requestAnimationFrame(frame);
}
function stepEffects() {
  for (const e of effects) { e.t++;
    if (e.k === 'ring' && e.t >= 9) e.del = true;
    if ((e.k === 'greenring' || e.k === 'redring') && e.t >= 7) e.del = true;
    if (e.k === 'dust') { e.x += e.xs; e.y += e.ys; if (e.t > 10) e.del = true; }
    if (e.k === 'boom' && e.t >= 20) e.del = true; }
  for (let i = effects.length - 1; i >= 0; i--) if (effects[i].del) effects.splice(i, 1);
  for (const t of trail) t.t++;
  while (trail.length && trail[0].t >= 20) trail.shift();
  txT++; gwT++;
}
let trailTick = 0;

function draw(v) {
  ctx.setTransform(2, 0, 0, 2, 0, 0); ctx.imageSmoothingEnabled = true;
  const mir = mirrored();
  // ---- the pitch and everything on it (mirrored for the left player) ----
  ctx.save();
  if (mir) { ctx.translate(800, 0); ctx.scale(-1, 1); }
  ctx.drawImage(buildPitch(), 0, 0, 800, 540);
  if (v && v.w) {
    for (const u of v.pu) { ctx.globalAlpha = u[3] < 60 && (u[3] >> 2) % 2 ? .4 : 1; drawPUIcon(ctx, u[1], u[2], u[0], 1.5); ctx.globalAlpha = 1; }
    if (v.b && ++trailTick % 2 === 0) trail.push({ x: v.b[0], y: v.b[1], t: 0 });
    for (const e of trail) { const w = 16 * (1 - e.t / 20); ctx.fillStyle = 'rgba(255,255,255,.35)'; ctx.beginPath(); ctx.arc(e.x, e.y, Math.max(0, w / 2), 0, 7); ctx.fill(); }
    const bp = v.b; ctx.fillStyle = 'rgba(0,0,0,.28)'; ctx.beginPath(); ctx.ellipse(bp[0], 463, 15, 5, 0, 0, 7); ctx.fill();
    if (v.st) { const sp = { x: v.st[0], y: v.st[1] }; ctx.fillStyle = '#f1c7a1'; ctx.beginPath(); ctx.arc(sp.x, sp.y, 20, 0, 7); ctx.fill();
      ctx.fillStyle = '#5a3a1e'; ctx.fillRect(sp.x - 18, sp.y - 20, 36, 8); ctx.fillStyle = '#111'; ctx.fillRect(sp.x - 8, sp.y - 4, 4, 4); ctx.fillRect(sp.x + 4, sp.y - 4, 4, 4);
      ctx.fillStyle = '#c0392b'; ctx.fillRect(sp.x - 7, sp.y + 8, 14, 3); }
    // the opponent behind, you in front
    if (mySide === 'R') { drawPlayer(v.L, false, false, v.f); drawPlayer(v.R, true, true, v.f); }
    else { drawPlayer(v.R, true, false, v.f); drawPlayer(v.L, false, true, v.f); }
    drawBallAt(bp[0], bp[1], bp[3], bp[2], bp[4]);
    drawGoal(0, v.g[0]); drawGoal(1, v.g[1]);
    for (const e of effects) {
      if (e.k === 'ring') { ctx.strokeStyle = `rgba(255,255,255,${1 - e.t / 10})`; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(e.x, e.y, 4 + e.t * 1.6, 0, 7); ctx.stroke(); }
      if (e.k === 'greenring' || e.k === 'redring') { ctx.strokeStyle = e.k === 'greenring' ? `rgba(60,220,80,${1 - e.t / 8})` : `rgba(230,50,40,${1 - e.t / 8})`; ctx.lineWidth = 3;
        ctx.beginPath(); ctx.ellipse(e.x, e.y, 14 + e.t * 2.5, 6 + e.t, 0, 0, 7); ctx.stroke(); }
      if (e.k === 'dust') { const s = 10 + e.t / 2; ctx.fillStyle = `rgba(214,200,160,${(1 - e.t / 10) * .6})`; ctx.beginPath(); ctx.arc(e.x, e.y, s / 2, 0, 7); ctx.fill(); }
      if (e.k === 'boom') { const k = e.t / 20; ctx.fillStyle = `rgba(255,${180 - k * 140 | 0},40,${1 - k})`; ctx.beginPath(); ctx.arc(e.x, e.y - 10, 10 + k * 30, 0, 7); ctx.fill();
        ctx.fillStyle = `rgba(80,80,80,${(1 - k) * .7})`; ctx.beginPath(); ctx.arc(e.x, e.y - 20 - k * 20, 8 + k * 18, 0, 7); ctx.fill(); }
    }
    for (const b of v.bm) { ctx.fillStyle = '#1b1b1b'; ctx.beginPath(); ctx.arc(b[0], b[1], 11, 0, 7); ctx.fill(); ctx.fillStyle = '#ff7a1a'; ctx.fillRect(b[0] - 1, b[1] - 19, 3, 7); ctx.fillStyle = '#ffe14a'; ctx.fillRect(b[0] - 1, b[1] - 21, 3, 3); }
  } else {
    // waiting for kick-off: both apes on their spots
    drawHeadAt(200, 440, 1, false, 'red'); drawHeadAt(600, 440, 1, true, 'blue');
    drawGoal(0, v ? v.g[0] : 1); drawGoal(1, v ? v.g[1] : 1);
  }
  ctx.restore();

  // ---- scoreboard and words (never mirrored) ----
  const myScore = v ? (mySide === 'L' ? v.sl : v.sr) : 0, theirScore = v ? (mySide === 'L' ? v.sr : v.sl) : 0;
  const myCol = mySide === 'R' ? '#5aa2ff' : '#ff3b2f', oppCol = mySide === 'R' ? '#ff3b2f' : '#5aa2ff';
  txt(oppName, 14, 22, 22, oppCol, 'left'); txt(myName, 786, 22, 22, myCol, 'right');
  txt(String(theirScore), 20, 82, 44, '#ffffff', 'left'); txt(String(myScore), 780, 82, 44, '#ffffff', 'right');
  const flash = v && v.fl < 18 && (v.fl < 6 || v.fl > 12);
  if (v && v.w) {
    if (v.gg) txt('GOLDEN GOAL', 400, 22, 24, '#ffcf3a', 'center', 5);
    else { const tl = v.tl; const s = tl <= 0 ? '0:00' : Math.floor(tl / 60) + ':' + (tl % 60 < 10 ? '0' : '') + tl % 60; txt(s, 400, 22, 24, flash ? '#ff3b2f' : '#f3f5ee', 'center'); }
  }
  if (flash && !matchOver) txt('10 SECONDS LEFT', 400, 54, 30, '#ff3b2f', 'center', 6);
  drawBar();
  uiTxt('Arrows / WASD - Move', 12, 499, 18, '#f3f5ee', 'left', 128); uiTxt('Space / P - Kick', 12, 522, 18, '#f3f5ee', 'left', 128);
  uiTxt(v && v.gg ? 'Next goal wins!' : '1 minute · golden goal if level', 222, 510, 18, '#f3f5ee', 'center', 126);
  ctx.save(); ctx.beginPath(); ctx.rect(298, 485, 270, 51); ctx.clip(); txt('FOOTY', 433, 511, 34, '#ffcf3a', 'center'); ctx.restore();
  drawSpeaker(744, 499, AU.music, true); drawSpeaker(772, 499, AU.sfx, false);
  updateSplash(v);
  if (netStat.show) {   // connection readout (press N)
    const now = performance.now(); while (netStat.gaps.length && netStat.gaps[0][0] < now - 3000) netStat.gaps.shift();
    const gaps = netStat.gaps.map(g => g[1]), late = gaps.filter(g => g > 60).length, maxGap = gaps.length ? Math.max(...gaps) : 0;
    const lines = ['ping ' + Math.round(rtt) + ' ms', 'frames ' + Math.round(gaps.length / 3) + '/s  late ' + late + '  worst gap ' + Math.round(maxGap) + ' ms',
      'smoothing ' + Math.round(delayF * 1000 / 30) + ' ms'];
    ctx.fillStyle = 'rgba(0,0,0,.6)'; ctx.fillRect(8, 112, 230, 60);
    lines.forEach((l, i) => uiTxt(l, 16, 126 + i * 18, 16, '#d4ff8a', 'left'));
  }
  if (!v) { txt(joined ? 'Waiting for ' + oppName + '…' : 'Connecting…', 400, 240, 40, '#ffffff', 'center', 7); return; }
  if (matchOver) return;   // the result screen is up: no game words behind it
  const over = v.gw && v.gw.win;
  if (!over && v.cnt >= 2 && v.cnt < 90 && v.f >= 90) txt(String(v.cnt < 30 ? 3 : v.cnt < 60 ? 2 : 1), 400, 92, 64, '#ffffff', 'center', 8);
  if (v.tx && txT < 100) { ctx.globalAlpha = (100 - txT) / 100; txt(v.tx.text, 400, 196, 56, '#ffffff', 'center', 8); ctx.globalAlpha = 1; }
  if (v.mp && v.w && !over) txt('MATCH POINT', 400, 128, 26, '#ffcf3a', 'center', 5);
  if (v.gw) {
    const k = Math.min(1, gwT / 6), meScored = v.gw.side === mySide;
    const words = v.gw.win ? (meScored ? 'You win !' : oppName + ' wins !') : (meScored ? 'GOAL !' : 'Goal to ' + oppName + ' !');
    ctx.save(); ctx.translate(400, 128); ctx.scale(.6 + .4 * k, .6 + .4 * k);
    txt(words, 0, 0, 54, v.gw.win ? '#ffcf3a' : '#ffffff', 'center', 9); ctx.restore();
  }
}

connect();
requestAnimationFrame(t => { lastT = t; frame(t); });
window.__footy = { snaps, get rtt() { return rtt; }, get delayF() { return delayF; }, get side() { return mySide; }, keysNow };   // test hook
})();
</script>
